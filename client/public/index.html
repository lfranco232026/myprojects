<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal — BSA/AML Compliance Community</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            navy: { DEFAULT: '#0D1F3C', light: '#1a3358', lighter: '#243d62' },
            gold: { DEFAULT: '#F5A623', light: '#f7b84d', dark: '#d4901e' },
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .toast-enter { animation: slideIn 0.3s ease-out; }
    .toast-exit { animation: slideOut 0.3s ease-in; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-20px); opacity: 0; } }
    .markdown-content p { margin-bottom: 0.5rem; }
    .markdown-content strong { font-weight: 600; }
    .markdown-content em { font-style: italic; }
    .markdown-content code { background: rgba(0,0,0,0.1); padding: 0.1em 0.3em; border-radius: 3px; font-size: 0.9em; }
    .markdown-content a { color: #F5A623; text-decoration: underline; }
    .markdown-content ol { list-style: decimal; margin-left: 1.5rem; margin-bottom: 0.5rem; }
    .markdown-content ul { list-style: disc; margin-left: 1.5rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
